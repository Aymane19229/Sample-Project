name: React SAST Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "📦 Installation des dépendances..."
          npm install --legacy-peer-deps

      - name: Run ESLint security checks
        run: |
          echo "🔒 Installation des outils de sécurité ESLint..."
          npm install eslint eslint-plugin-security eslint-plugin-no-secrets --save-dev --legacy-peer-deps
          echo "🔍 Analyse de sécurité avec ESLint..."
          npx eslint src --ext .js,.jsx --format=stylish || echo "⚠️ ESLint a trouvé des problèmes de sécurité"
        continue-on-error: true

      - name: Run npm audit and generate report
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          echo "### Résumé des vulnérabilités SAST"
          cat audit-report.json | jq '.advisories | keys | length as $count | "Vulnérabilités détectées : \($count)"' || true
          cat audit-report.json | jq '.advisories | to_entries[] | "\(.value.severity) - \(.value.module_name) - \(.value.title)"' || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: ./Frontend/audit-report.json

      - name: Build project
        run: npm run build