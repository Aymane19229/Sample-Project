name: React SAST Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security checks
        run: |
          npm install eslint eslint-plugin-security eslint-plugin-no-secrets --save-dev
          npx eslint src --ext .js,.jsx || echo "ESLint a trouvé des avertissements ou erreurs"

      - name: Run npm audit and generate report
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          echo "### Résumé des vulnérabilités SAST"
          cat audit-report.json | jq '.advisories | keys | length as $count | "Vulnérabilités détectées : \($count)"' || true
          cat audit-report.json | jq '.advisories | to_entries[] | "\(.value.severity) - \(.value.module_name) - \(.value.title)"' || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

      - name: Build project
        run: npm run build