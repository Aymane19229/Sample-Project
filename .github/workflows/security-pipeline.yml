name: Full Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Job SAST
  # =========================
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SAST)
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Run ESLint
        run: |
          npx eslint src --ext .js,.jsx -f json -o eslint-report.json || true

      - name: Upload SAST npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: sast-npm-audit
          path: ./Frontend/audit-report.json
          retention-days: 30

      - name: Upload SAST ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: sast-eslint
          path: ./Frontend/eslint-report.json
          retention-days: 30

  # =========================
  # Job DAST
  # =========================
  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    needs: sast  # peut attendre SAST, facultatif

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build and serve frontend
        working-directory: ./Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx serve -s build -l 5000 &
          sleep 10
        env:
          CI: true

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: ./zap-report.html
          retention-days: 30

  # =========================
  # Job SCA
  # =========================
  sca:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SCA)
        run: |
          npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: ./Frontend/sca-report.json
          retention-days: 30

  # =========================
  # Job Global Report
  # =========================
  aggregate-report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dast, sca]  # attend que tous les jobs soient terminés

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SAST npm audit
        uses: actions/download-artifact@v4
        with:
          name: sast-npm-audit
          path: ./reports/sast

      - name: Download SAST ESLint
        uses: actions/download-artifact@v4
        with:
          name: sast-eslint
          path: ./reports/sast

      - name: Download DAST
        uses: actions/download-artifact@v4
        with:
          name: dast-report
          path: ./reports/dast

      - name: Download SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: ./reports/sca

      - name: Merge reports into global JSON
        run: |
          mkdir -p reports/global
          jq -s '{sast_npm_audit: .[0], sast_eslint: .[1], dast: .[2], sca: .[3]}' \
            ./reports/sast/audit-report.json \
            ./reports/sast/eslint-report.json \
            ./reports/dast/zap-report.html \
            ./reports/sca/sca-report.json \
            > ./reports/global/global-report.json

      - name: Upload Global Report
        uses: actions/upload-artifact@v4
        with:
          name: global-security-report
          path: ./reports/global/global-report.json
          retention-days: 30
