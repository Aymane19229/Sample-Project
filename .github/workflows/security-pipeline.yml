name: Full Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Job SAST
  # =========================
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SAST)
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Run ESLint
        run: |
          npx eslint src --ext .js,.jsx -f json -o eslint-report.json || true

      - name: Upload SAST npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-npm-audit
          path: ./Frontend/audit-report.json
          retention-days: 30

      - name: Upload SAST ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-eslint
          path: ./Frontend/eslint-report.json
          retention-days: 30

  # =========================
  # Job DAST
  # =========================
  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build and serve frontend
        working-directory: ./Frontend
        run: |
          echo "📦 Installation des dépendances..."
          npm install --legacy-peer-deps
          
          echo "🏗️ Build du projet..."
          npm run build
          
          echo "🚀 Démarrage du serveur..."
          npx serve -s build -l 5000 > serve.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          echo "⏳ Attente du démarrage du serveur..."
          sleep 15
          
          echo "🔍 Vérification du serveur..."
          curl -f http://localhost:5000 || echo "❌ Le serveur ne répond pas"
          
          echo "📋 Log du serveur:"
          cat serve.log || echo "Pas de logs"
        env:
          CI: true

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        continue-on-error: true
        with:
          target: "http://localhost:5000"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'

      - name: Debug - List generated files
        if: always()
        run: |
          echo "📁 Fichiers dans le répertoire actuel:"
          ls -la
          echo ""
          echo "📁 Recherche des rapports ZAP:"
          find . -name "*.html" -o -name "*.md" -o -name "*.json" | grep -i zap || echo "Aucun rapport ZAP trouvé"

      - name: Create DAST report if missing
        if: always()
        run: |
          if [ ! -f "report_json.json" ]; then
            echo "⚠️ Aucun rapport DAST JSON généré, création d'un rapport par défaut..."
            cat > report_json.json << 'EOF'
          {
            "status": "failed",
            "message": "DAST scan did not complete successfully",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "site": []
          }
          EOF
          fi

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 30

  # =========================
  # Job SCA
  # =========================
  sca:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SCA)
        run: |
          npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: ./Frontend/sca-report.json
          retention-days: 30

  # =========================
  # Job Global Report
  # =========================
  aggregate-report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dast, sca]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SAST npm audit
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sast-npm-audit
          path: ./reports/sast

      - name: Download SAST ESLint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sast-eslint
          path: ./reports/sast

      - name: Download DAST
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dast-report
          path: ./reports/dast

      - name: Download SCA
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sca-report
          path: ./reports/sca

      - name: Create fallback reports for missing artifacts
        run: |
          mkdir -p reports/{sast,dast,sca,global}
          
          # Fallback pour SAST npm audit
          if [ ! -f "./reports/sast/audit-report.json" ]; then
            echo '{"vulnerabilities": {}, "metadata": {"vulnerabilities": {"total": 0}}}' > ./reports/sast/audit-report.json
          fi
          
          # Fallback pour SAST ESLint
          if [ ! -f "./reports/sast/eslint-report.json" ]; then
            echo '[]' > ./reports/sast/eslint-report.json
          fi
          
          # Fallback pour DAST
          if [ ! -f "./reports/dast/report_json.json" ]; then
            echo '{"status": "failed", "site": []}' > ./reports/dast/report_json.json
          fi
          
          # Fallback pour SCA
          if [ ! -f "./reports/sca/sca-report.json" ]; then
            echo '{"vulnerabilities": {}, "metadata": {"vulnerabilities": {"total": 0}}}' > ./reports/sca/sca-report.json
          fi
          
          echo "✅ Fallback reports créés"
          ls -R ./reports/

      - name: Merge reports into global JSON
        run: |
          jq -s '{
            sast: {
              npm_audit: .[0],
              eslint: .[1]
            },
            dast: .[2],
            sca: .[3],
            summary: {
              generated_at: now | strftime("%Y-%m-%d %H:%M:%S"),
              pipeline_status: "completed"
            }
          }' \
            ./reports/sast/audit-report.json \
            ./reports/sast/eslint-report.json \
            ./reports/dast/report_json.json \
            ./reports/sca/sca-report.json \
            > ./reports/global/global-report.json
          
          echo "✅ Global report created"
          echo "📄 Content preview:"
          cat ./reports/global/global-report.json | head -20

      - name: Generate summary report
        run: |
          echo "# 🔒 Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Reports Generated:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./reports/sast/audit-report.json" ]; then
            echo "✅ SAST npm audit" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SAST npm audit (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/sast/eslint-report.json" ]; then
            echo "✅ SAST ESLint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SAST ESLint (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/dast/report_json.json" ]; then
            echo "✅ DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ DAST (OWASP ZAP failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/sca/sca-report.json" ]; then
            echo "✅ SCA" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SCA (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the **global-security-report** artifact for complete details." >> $GITHUB_STEP_SUMMARY

      - name: Upload Global Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-security-report
          path: ./reports/
          retention-days: 30

  # =========================
  # Job PARSING (analyse des rapports)
  # =========================
  parse-reports:
    name: Parse Security Reports
    runs-on: ubuntu-latest
    needs: [aggregate-report]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Global Report
        uses: actions/download-artifact@v4
        with:
          name: global-security-report
          path: ./reports-download

      - name: Debug - Verify downloaded structure
        run: |
          echo "📁 Structure des fichiers téléchargés:"
          ls -R ./reports-download/
          echo ""
          echo "🔍 Recherche du global-report.json:"
          find ./reports-download -name "global-report.json" -type f

      - name: Reorganize reports structure
        run: |
          # Créer la structure attendue
          mkdir -p ./reports
          
          # Copier les fichiers à la bonne place
          if [ -d "./reports-download/global" ]; then
            cp -r ./reports-download/global ./reports/
          fi
          if [ -d "./reports-download/sast" ]; then
            cp -r ./reports-download/sast ./reports/
          fi
          if [ -d "./reports-download/dast" ]; then
            cp -r ./reports-download/dast ./reports/
          fi
          if [ -d "./reports-download/sca" ]; then
            cp -r ./reports-download/sca ./reports/
          fi
          
          echo "✅ Structure réorganisée:"
          ls -R ./reports/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Parse Security Reports
        run: |
          echo "🔍 Starting parsing..."
          python parse_security_reports.py
        env:
          REPORTS_DIR: ./reports

      - name: Display parsing results
        if: always()
        run: |
          echo "📊 Parsing Results:"
          echo ""
          
          if [ -f "./reports/global/summary.json" ]; then
            echo "✅ Summary JSON created"
            echo "📄 Summary content:"
            cat ./reports/global/summary.json | jq '.' || cat ./reports/global/summary.json
          else
            echo "❌ Summary JSON not found"
          fi
          
          echo ""
          
          if [ -f "./reports/global/SECURITY_REPORT.md" ]; then
            echo "✅ Markdown report created"
            echo "📄 First 50 lines:"
            head -50 ./reports/global/SECURITY_REPORT.md
          else
            echo "❌ Markdown report not found"
          fi

      - name: Add parsed results to GitHub Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./reports/global/SECURITY_REPORT.md" ]; then
            cat ./reports/global/SECURITY_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Parsed report not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Parsed Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parsed-security-reports
          path: |
            ./reports/global/summary.json
            ./reports/global/SECURITY_REPORT.md
          retention-days: 30

      - name: Check for critical vulnerabilities
        if: always()
        run: |
          if [ -f "./reports/global/summary.json" ]; then
            # Vérifier si jq est disponible
            if command -v jq &> /dev/null; then
              CRITICAL_COUNT=$(cat ./reports/global/summary.json | jq '.metrics.by_severity.critical // 0')
              HIGH_COUNT=$(cat ./reports/global/summary.json | jq '.metrics.by_severity.high // 0')
              
              echo "🔍 Security Check Results:"
              echo "  Critical: $CRITICAL_COUNT"
              echo "  High: $HIGH_COUNT"
              
              if [ "$CRITICAL_COUNT" -gt 0 ]; then
                echo "::error::❌ Found $CRITICAL_COUNT critical vulnerabilities!"
                exit 1
              elif [ "$HIGH_COUNT" -gt 5 ]; then
                echo "::warning::⚠️ Found $HIGH_COUNT high severity vulnerabilities"
              else
                echo "::notice::✅ Security scan passed!"
              fi
            else
              echo "⚠️ jq not available, skipping vulnerability check"
            fi
          else
            echo "⚠️ Summary file not found, skipping vulnerability check"
          fi