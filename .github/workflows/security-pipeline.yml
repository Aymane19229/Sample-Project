name: Full Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Job Security Pipeline
  # =========================
  security-pipeline:
    name: Security Pipeline (SAST + DAST + SCA + Parsing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # =========================
      # SAST
      # =========================
      - name: Run npm audit (SAST)
        run: npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Run ESLint
        run: npx eslint src --ext .js,.jsx -f json -o eslint-report.json || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            audit-report.json
            eslint-report.json
          retention-days: 30

      # =========================
      # DAST
      # =========================
      - name: Build and serve frontend
        run: |
          npm run build
          npx serve -s build -l 5000 > serve.log 2>&1 &
          SERVER_PID=$!
          sleep 15
          curl -f http://localhost:5000 || echo "❌ Le serveur ne répond pas"
          cat serve.log || echo "Pas de logs"
        env:
          CI: true

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        continue-on-error: true
        with:
          target: "http://localhost:5000"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'

      - name: Create fallback DAST report
        run: |
          mkdir -p reports/dast
          if [ ! -f "./Frontend/zap-report.json" ]; then
            echo '{"status": "failed", "message": "DAST report missing"}' > reports/dast/dast-report.json
          else
            cp ./Frontend/zap-report.json reports/dast/dast-report.json
          fi

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: ./reports/dast/dast-report.json
          retention-days: 30

      # =========================
      # SCA
      # =========================
      - name: Run npm audit (SCA)
        run: npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: ./Frontend/sca-report.json
          retention-days: 30

      # =========================
      # Merge reports into global JSON
      # =========================
      - name: Create fallback reports directories
        run: mkdir -p reports/{sast,dast,sca,global}

      - name: Merge reports
        run: |
          # Fallback reports
          cp -f audit-report.json reports/sast/audit-report.json || echo '{"error":"missing"}' > reports/sast/audit-report.json
          cp -f eslint-report.json reports/sast/eslint-report.json || echo '{"error":"missing"}' > reports/sast/eslint-report.json
          cp -f reports/dast/dast-report.json reports/dast/dast-report.json || echo '{"status":"failed"}' > reports/dast/dast-report.json
          cp -f sca-report.json reports/sca/sca-report.json || echo '{"error":"missing"}' > reports/sca/sca-report.json

          # Merge global report
          jq -s '{
            sast: { npm_audit: .[0], eslint: .[1] },
            dast: .[2],
            sca: .[3],
            summary: { generated_at: now | strftime("%Y-%m-%d %H:%M:%S"), pipeline_status: "completed" }
          }' \
            reports/sast/audit-report.json \
            reports/sast/eslint-report.json \
            reports/dast/dast-report.json \
            reports/sca/sca-report.json \
            > reports/global/global-report.json

      # =========================
      # Parsing global report
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Parse Security Reports
        run: |
          python - <<'EOF'
          import json, os
          path = "reports/global/global-report.json"
          if not os.path.exists(path):
              print("❌ Le fichier global-report.json n'existe pas.")
              exit(1)
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          summary = {
              "npm_audit_vuln_count": len(data.get("sast", {}).get("npm_audit", {}).get("vulnerabilities", {})),
              "eslint_error_count": len(data.get("sast", {}).get("eslint", [])),
              "sca_vuln_count": len(data.get("sca", {}).get("vulnerabilities", {})),
              "zap_scan_status": data.get("dast", {}).get("status", "unknown"),
          }
          critical_vulns = [k for k,v in data.get("sast", {}).get("npm_audit", {}).get("vulnerabilities", {}).items() if v.get("severity")=="critical"]
          summary["critical_vulnerabilities"] = critical_vulns
          os.makedirs("reports/global", exist_ok=True)
          with open("reports/global/summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2, ensure_ascii=False)
          print("✅ Résumé généré :", "reports/global/summary.json")
          EOF

      - name: Upload Parsed Summary
        uses: actions/upload-artifact@v4
        with:
          name: parsed-summary
          path: ./reports/global/summary.json
          retention-days: 30
