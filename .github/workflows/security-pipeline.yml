name: Full Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Job SAST
  # =========================
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SAST)
        run: npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Run ESLint
        run: npx eslint src --ext .js,.jsx -f json -o eslint-report.json || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            ./Frontend/audit-report.json
            ./Frontend/eslint-report.json
          retention-days: 30

  # =========================
  # Job DAST
  # =========================
  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build and serve frontend
        working-directory: ./Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx serve -s build -l 5000 & sleep 15

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        continue-on-error: true
        with:
          target: "http://localhost:5000"
          cmd_options: "-a -j"

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: ./Frontend/zap-report.json
          retention-days: 30

  # =========================
  # Job SCA
  # =========================
  sca:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SCA)
        run: npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: ./Frontend/sca-report.json
          retention-days: 30

  # =========================
  # Job Global Report
  # =========================
  aggregate-report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dast, sca]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: ./reports/sast

      - name: Download DAST report
        uses: actions/download-artifact@v4
        with:
          name: dast-report
          path: ./reports/dast

      - name: Download SCA report
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: ./reports/sca

      - name: Merge reports into global JSON
        run: |
          mkdir -p reports/global
          jq -s '{
            sast: {
              npm_audit: .[0],
              eslint: .[1]
            },
            dast: .[2],
            sca: .[3],
            summary: {
              generated_at: now | strftime("%Y-%m-%d %H:%M:%S"),
              pipeline_status: "completed"
            }
          }' \
            ./reports/sast/audit-report.json \
            ./reports/sast/eslint-report.json \
            ./reports/dast/zap-report.json \
            ./reports/sca/sca-report.json \
            > ./reports/global/global-report.json

      - name: Upload Global Report
        uses: actions/upload-artifact@v4
        with:
          name: global-security-report
          path: ./reports/global/global-report.json
          retention-days: 30

  # =========================
  # Job Parsing (Python)
  # =========================
  parse-reports:
    name: Parse Security Reports
    runs-on: ubuntu-latest
    needs: [aggregate-report]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Global Report
        uses: actions/download-artifact@v4
        with:
          name: global-security-report
          path: ./reports/global

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Parse Security Reports
        run: python parse_security_reports.py

      - name: Upload Parsed Summary
        uses: actions/upload-artifact@v4
        with:
          name: parsed-summary
          path: ./reports/global/summary.json
          retention-days: 30
