name: Full Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Job SAST
  # =========================
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SAST)
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Run ESLint
        run: |
          npx eslint src --ext .js,.jsx -f json -o eslint-report.json || true

      - name: Upload SAST npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-npm-audit
          path: ./Frontend/audit-report.json
          retention-days: 30

      - name: Upload SAST ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-eslint
          path: ./Frontend/eslint-report.json
          retention-days: 30

  # =========================
  # Job DAST
  # =========================
  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build and serve frontend
        working-directory: ./Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx serve -s build -l 5000 &
          sleep 10
        env:
          CI: true

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: "http://localhost:5000"
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: |
            ./zap_scan.html
            ./report_html.html
            ./report_md.md
          retention-days: 30

  # =========================
  # Job SCA
  # =========================
  sca:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (SCA)
        run: |
          npm audit --json > sca-report.json || true

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: ./Frontend/sca-report.json
          retention-days: 30

  # =========================
  # Job Global Report
  # =========================
  aggregate-report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dast, sca]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SAST npm audit
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sast-npm-audit
          path: ./reports/sast

      - name: Download SAST ESLint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sast-eslint
          path: ./reports/sast

      - name: Download DAST
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dast-report
          path: ./reports/dast

      - name: Download SCA
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sca-report
          path: ./reports/sca

      - name: Create fallback reports for missing artifacts
        run: |
          mkdir -p reports/{sast,dast,sca,global}
          
          # Fallback pour SAST npm audit
          if [ ! -f "./reports/sast/audit-report.json" ]; then
            echo '{"error": "SAST npm audit not available"}' > ./reports/sast/audit-report.json
          fi
          
          # Fallback pour SAST ESLint
          if [ ! -f "./reports/sast/eslint-report.json" ]; then
            echo '{"error": "SAST ESLint not available"}' > ./reports/sast/eslint-report.json
          fi
          
          # Fallback pour DAST
          if [ ! -f "./reports/dast/zap_scan.html" ]; then
            echo '{"error": "DAST report not available"}' > ./reports/dast/dast-report.json
          else
            # Convertir HTML en JSON basique pour la fusion
            echo '{"status": "DAST completed", "report": "See HTML artifact"}' > ./reports/dast/dast-report.json
          fi
          
          # Fallback pour SCA
          if [ ! -f "./reports/sca/sca-report.json" ]; then
            echo '{"error": "SCA report not available"}' > ./reports/sca/sca-report.json
          fi

      - name: Merge reports into global JSON
        run: |
          jq -s '{
            sast: {
              npm_audit: .[0],
              eslint: .[1]
            },
            dast: .[2],
            sca: .[3],
            summary: {
              generated_at: now | strftime("%Y-%m-%d %H:%M:%S"),
              pipeline_status: "completed"
            }
          }' \
            ./reports/sast/audit-report.json \
            ./reports/sast/eslint-report.json \
            ./reports/dast/dast-report.json \
            ./reports/sca/sca-report.json \
            > ./reports/global/global-report.json

      - name: Generate summary report
        run: |
          echo "# 🔒 Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Reports Generated:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./reports/sast/audit-report.json" ]; then
            echo "✅ SAST npm audit" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SAST npm audit (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/sast/eslint-report.json" ]; then
            echo "✅ SAST ESLint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SAST ESLint (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/dast/zap_scan.html" ]; then
            echo "✅ DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ DAST (OWASP ZAP failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./reports/sca/sca-report.json" ]; then
            echo "✅ SCA" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SCA (failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the **global-security-report** artifact for complete details." >> $GITHUB_STEP_SUMMARY

      - name: Upload Global Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-security-report
          path: ./reports/
          retention-days: 30